name: Docker Validation

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  docker-qemu-test:
    name: Build image and run tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ldd-lab-ci .

      - name: Run full validation in container
        run: |
          if [ -e /dev/kvm ]; then
            docker run --rm --device /dev/kvm ldd-lab-ci test --kvm
          else
            docker run --rm ldd-lab-ci test
          fi
