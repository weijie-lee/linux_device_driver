name: Docker Validation

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  docker-qemu-test:
    name: Build image and run tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ldd-lab-ci .

      - name: Run full validation in container
        run: docker run --rm --entrypoint bash ldd-lab-ci qemu_test/qemu_test_all.sh
